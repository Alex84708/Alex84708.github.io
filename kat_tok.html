<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PartyTok - One Video Loop</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for vertical screen layout */
        .tiktok-container {
            /* Max width/height to simulate a mobile screen frame, centered */
            max-width: 420px;
            max-height: 100vh;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background-color: #000;
            margin: 0 auto;
        }
        /* Style for the actual video element */
        .tiktok-video {
            object-fit: cover;
            width: 100%;
            height: 100%;
        }
        /* Custom hover effect for icons */
        .action-icon:hover {
            transform: scale(1.1);
        }
        /* Pulse animation for the play/pause button */
        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.2; }
        }
        .pulse-animation {
            animation: pulse 1.5s infinite;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }

        // Helper function for exponential backoff retry logic
        async function fetchWithRetry(url, options, retries = 3) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return await response.json();
                } catch (error) {
                    if (i === retries - 1) {
                        console.error("Fetch failed after all retries:", error);
                        throw error;
                    }
                    const delay = Math.pow(2, i) * 1000;
                    console.warn(`Fetch attempt ${i + 1} failed. Retrying in ${delay / 1000}s...`);
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 font-sans h-screen flex items-center justify-center p-0 md:p-4">

    <div id="app" class="tiktok-container shadow-2xl rounded-xl">
        <!-- Video Player -->
        <video id="partyVideo" class="tiktok-video" autoplay loop muted playsinline onclick="togglePlayPause()">
            <!-- Using a royalty-free looping video (Spinning Bike Wheel) -->
            <source src="http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <!-- Play/Pause Icon Overlay -->
        <div id="playPauseIndicator" class="absolute inset-0 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
            <!-- Play icon (Triangle) -->
            <svg id="playIcon" class="w-20 h-20 text-white drop-shadow-lg pulse-animation" fill="currentColor" viewBox="0 0 24 24" style="display: none;">
                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v14zm2-14h8v14H8V5z"/>
                <path d="M12 16.5l4-3.5-4-3.5v7z"/>
            </svg>
            <!-- Pause icon (Two Bars) -->
            <svg id="pauseIcon" class="w-20 h-20 text-white drop-shadow-lg" fill="currentColor" viewBox="0 0 24 24" style="display: none;">
                <path d="M6 19c0 1.1.9 2 2 2h2c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v14zm6-14h2v14h-2V5zm4 0h2v14h-2V5z"/>
            </svg>
        </div>

        <!-- Content Overlay (User Info and Actions) -->
        <div class="absolute inset-0 flex flex-col justify-end p-4 text-white pointer-events-none">

            <!-- Video Info (Left Bottom) -->
            <div class="mb-4">
                <div class="flex items-center text-lg font-bold drop-shadow-sm mb-1">
                    <span class="mr-2">@PartyStarter99</span>
                    <!-- Verified Checkmark Icon -->
                    <svg class="w-4 h-4 text-sky-400" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.85-9.43a.75.75 0 00-1.06-1.06L9 11.94l-1.39-1.39a.75.75 0 00-1.06 1.06l2 2a.75.75 0 001.06 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <p class="text-sm drop-shadow-sm mb-1">
                    POV: The DJ finally plays that one song! 🎉 Get ready to dance! #PartyVibes #TikTokClone
                </p>
                <div class="flex items-center text-xs font-semibold drop-shadow-sm">
                    <!-- Music Note Icon (Inline SVG) -->
                    <svg class="w-4 h-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c-3.879 0-7 2.13-7 4s3.121 4 7 4c3.878 0 7-2.13 7-4s-3.122-4-7-4zm12-3c-3.879 0-7 2.13-7 4s3.121 4 7 4c3.878 0 7-2.13 7-4s-3.122-4-7-4z"/>
                    </svg>
                    Original Sound - The Best Party Mix
                </div>
            </div>

            <!-- Action Buttons (Right Bottom) -->
            <div class="absolute right-4 bottom-4 flex flex-col space-y-4 pointer-events-auto">

                <!-- User Profile Image -->
                <div class="w-12 h-12 rounded-full border-2 border-white bg-pink-500 flex items-center justify-center shadow-lg transform transition duration-300 hover:scale-105">
                    <span class="text-xl font-bold">P</span>
                </div>
                <!-- Mini Spinning Disc (Music) -->
                <div id="musicDisc" class="w-6 h-6 rounded-full bg-gray-900 border-2 border-white mx-auto shadow-md animate-spin-slow">
                    <div class="w-1 h-1 bg-white rounded-full absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
                </div>

                <!-- Like Button -->
                <div class="flex flex-col items-center cursor-pointer transition duration-200 action-icon" onclick="toggleLike()">
                    <!-- Heart Icon (Inline SVG) -->
                    <svg id="heartIcon" class="w-8 h-8 text-white transition-colors duration-200" fill="currentColor" viewBox="0 0 24 24">
                        <path id="heartPath" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                    <span id="likeCount" class="text-xs font-semibold mt-0.5 drop-shadow-sm">420M</span>
                </div>

                <!-- Comment Button -->
                <div class="flex flex-col items-center cursor-pointer transition duration-200 action-icon" onclick="showMessage('Comments are disabled for party mode!')">
                    <!-- Comment Icon (Inline SVG) -->
                    <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.888 9.888 0 01-3.621-.629M21 12c0-4.418-4.03-8-9-8s-9 3.582-9 8c0 1.09.28 2.123.834 3.031l-.226.753A1 1 0 003 16.5v1.25a.75.75 0 001.298.547l1.04-.849A10 10 0 0012 20c4.97 0 9-3.582 9-8z"/>
                    </svg>
                    <span class="text-xs font-semibold mt-0.5 drop-shadow-sm">34</span>
                </div>

                <!-- Share Button -->
                <div class="flex flex-col items-center cursor-pointer transition duration-200 action-icon" onclick="showMessage('Share link copied to clipboard!')">
                    <!-- Share Icon (Inline SVG) -->
                    <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.592 9 11.832 9 11c0-2.343.878-4.48 2.308-6.064C13.563 3.486 15.568 2 17.5 2c3.597 0 6.5 3.003 6.5 6.706C24 10.983 22.844 13 20 13c-2.368 0-4.328-1.554-5.34-3.528A4.47 4.47 0 0012 14c-1.57 0-3.04.47-4.22 1.354l-1.95 2.138A10.87 10.87 0 0012 22c3.597 0 6.5-3.003 6.5-6.706C18.5 13.313 17.344 11 14.5 11c-2.368 0-4.328-1.554-5.34-3.528z"/>
                    </svg>
                    <span class="text-xs font-semibold mt-0.5 drop-shadow-sm">9</span>
                </div>
            </div>
        </div>

        <!-- Message Box for Alerts (Bottom Center) -->
        <div id="messageBox" class="fixed bottom-10 left-1/2 -translate-x-1/2 p-3 bg-red-600 text-white rounded-lg shadow-xl z-50 transition-opacity duration-300 opacity-0 pointer-events-none">
            Notification!
        </div>

    </div>

    <script>
        const video = document.getElementById('partyVideo');
        const heartIcon = document.getElementById('heartIcon');
        const heartPath = document.getElementById('heartPath');
        const likeCountElement = document.getElementById('likeCount');
        const playPauseIndicator = document.getElementById('playPauseIndicator');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const messageBox = document.getElementById('messageBox');

        let isLiked = false;
        let likeCount = 1200;
        let isVideoPaused = false; // Initial state: playing (autoplay)

        // Ensure video is playing on page load (important for mobile safari)
        document.addEventListener('DOMContentLoaded', () => {
            // Check if autoplay succeeded, otherwise show the play button
            video.addEventListener('playing', () => {
                isVideoPaused = false;
            });
            video.addEventListener('pause', () => {
                isVideoPaused = true;
            });

            // Initial attempt to play (to handle browser restrictions)
            video.play().catch(error => {
                console.log("Autoplay failed, user must click to start:", error);
                // If autoplay fails, show the play indicator
                showIndicator(playIcon);
                isVideoPaused = true;
            });

            // Hide the default play indicator after 1 second if playing
            setTimeout(() => {
                if (!isVideoPaused) {
                    hideIndicator();
                }
            }, 1000);
        });

        function showIndicator(iconElement) {
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'none';
            iconElement.style.display = 'block';
            playPauseIndicator.classList.remove('opacity-0');
            playPauseIndicator.classList.add('opacity-100');
        }

        function hideIndicator() {
            playPauseIndicator.classList.remove('opacity-100');
            playPauseIndicator.classList.add('opacity-0');
        }

        /**
         * Handles playing and pausing the video, and toggles the icon indicator.
         */
        function togglePlayPause() {
            if (video.paused) {
                video.play();
                isVideoPaused = false;
                showIndicator(pauseIcon);
            } else {
                video.pause();
                isVideoPaused = true;
                showIndicator(playIcon);
            }

            // Hide the indicator after a short delay
            setTimeout(hideIndicator, 500);
        }

        /**
         * Toggles the like state and updates the count and icon style.
         */
        function toggleLike() {
            isLiked = !isLiked;

            if (isLiked) {
                // Liked state
                heartIcon.classList.remove('text-white');
                heartIcon.classList.add('text-red-500', 'drop-shadow-md');
                heartPath.setAttribute('fill', 'currentColor');
                likeCount += 1;
                // Add a small bounce animation
                heartIcon.classList.add('scale-125');
                setTimeout(() => heartIcon.classList.remove('scale-125'), 200);

            } else {
                // Unliked state
                heartIcon.classList.add('text-white');
                heartIcon.classList.remove('text-red-500', 'drop-shadow-md');
                heartPath.setAttribute('fill', 'none'); // Make it an outline when unliked
                likeCount -= 1;
            }

            // Format the count (simple K notation)
            likeCountElement.textContent = likeCount >= 1000 ? (likeCount / 1000).toFixed(1) + 'K' : likeCount;
        }

        /**
         * Displays a temporary notification message at the bottom.
         */
        function showMessage(text) {
            messageBox.textContent = text;
            messageBox.classList.remove('opacity-0', 'pointer-events-none');
            messageBox.classList.add('opacity-100', 'pointer-events-auto');

            setTimeout(() => {
                messageBox.classList.remove('opacity-100', 'pointer-events-auto');
                messageBox.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);

            // For the share button, copy to clipboard
            if (text.includes('copied')) {
                const dummy = document.createElement('textarea');
                // Use a generic placeholder link for the party
                dummy.value = window.location.href; 
                document.body.appendChild(dummy);
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
            }
        }

        // Add a spinning effect utility class (Tailwind only provides spin)
        const style = document.createElement('style');
        style.textContent = `
            .animate-spin-slow {
                animation: spin 3s linear infinite;
            }
            @keyframes spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
