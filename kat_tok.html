<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KatTok</title>
    
    <!-- NEW: Favicon Link. This will override any sitewide default favicon. -->
    <!-- Using a remote cat icon for instant display. Change the 'href' to a local path (e.g., 'assets/favicon.ico') if you upload a custom file. -->
    <link rel="icon" type="image/png" href="https://img.icons8.com/color/48/cat.png">
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for vertical screen layout */
        .tiktok-container {
            /* Max width/height to simulate a mobile screen frame, centered */
            max-width: 420px;
            max-height: 100vh;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background-color: #000;
            margin: 0 auto;
        }
        /* Style for the actual video element */
        .tiktok-video {
            object-fit: cover;
            width: 100%;
            height: 100%;
        }
        /* Custom hover effect for icons */
        .action-icon:hover {
            transform: scale(1.1);
        }
        /* Pulse animation for the play/pause button */
        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.2; }
        }
        .pulse-animation {
            animation: pulse 1.5s infinite;
        }
        /* Ensure the comments panel fills the screen width of the container */
        #commentsPanel {
            position: fixed;
            top: 0;
            left: 50%;
            /* Half the container width to offset the transformX */
            width: 100%; 
            max-width: 420px;
            /* Center the panel horizontally */
            transform: translate(-50%, 100%); 
            transition: transform 0.3s ease-out;
            height: 100vh;
        }
        #commentsPanel.is-visible {
            transform: translate(-50%, 0);
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }

        // Helper function for exponential backoff retry logic (not strictly needed for this clone, but kept for robust practice)
        async function fetchWithRetry(url, options, retries = 3) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return await response.json();
                } catch (error) {
                    if (i === retries - 1) {
                        console.error("Fetch failed after all retries:", error);
                        throw error;
                    }
                    const delay = Math.pow(2, i) * 1000;
                    console.warn(`Fetch attempt ${i + 1} failed. Retrying in ${delay / 1000}s...`);
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 font-sans h-screen flex items-center justify-center p-0 md:p-4">

    <div id="app" class="tiktok-container shadow-2xl rounded-xl">
        <!-- Video Player -->
        <!-- NOTE: The 'muted' attribute is REQUIRED for mobile autoplay, so we keep it initially. -->
        <video id="partyVideo" class="tiktok-video" autoplay loop muted playsinline onclick="togglePlayPause()">
            <!-- Updated video source to BigBuckBunny -->
            <source src="assets/kat_tok.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <!-- Play/Pause Icon Overlay -->
        <div id="playPauseIndicator" class="absolute inset-0 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
            <!-- Play icon (Triangle) -->
            <svg id="playIcon" class="w-20 h-20 text-white drop-shadow-lg pulse-animation" fill="currentColor" viewBox="0 0 24 24" style="display: none;">
                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v14zm2-14h8v14H8V5z"/>
                <path d="M12 16.5l4-3.5-4-3.5v7z"/>
            </svg>
            <!-- Pause icon (Two Bars) -->
            <svg id="pauseIcon" class="w-20 h-20 text-white drop-shadow-lg" fill="currentColor" viewBox="0 0 24 24" style="display: none;">
                <path d="M6 19c0 1.1.9 2 2 2h2c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v14zm6-14h2v14h-2V5zm4 0h2v14h-2V5z"/>
            </svg>
        </div>

        <!-- Content Overlay (User Info and Actions) -->
        <div class="absolute inset-0 flex flex-col justify-end p-4 text-white pointer-events-none">

            <!-- Video Info (Left Bottom) -->
            <div class="mb-4">
                <div class="flex items-center text-lg font-bold drop-shadow-sm mb-1">
                    <span class="mr-2">@spoonser</span>
                    <!-- Verified Checkmark Icon -->
                    <svg class="w-4 h-4 text-sky-400" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.85-9.43a.75.75 0 00-1.06-1.06L9 11.94l-1.39-1.39a.75.75 0 00-1.06 1.06l2 2a.75.75 0 001.06 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <!-- Updated Description -->
                <p class="text-sm drop-shadow-sm mb-3">
                    Kats are better than dogs!
                </p>
                <!-- Removed: Original Sound information section -->
            </div>

            <!-- Action Buttons (Right Bottom) -->
            <div class="absolute right-4 bottom-4 flex flex-col space-y-4 pointer-events-auto">

                <!-- User Profile Image - CORRECTED FILEPATH -->
                <img 
                    src="assets/poncho.jpeg"
                    alt="Profile Picture of Poncho"
                    onerror="this.onerror=null; this.src='https://placehold.co/48x48/73C6B6/FFFFFF?text=Kat';" 
                    class="w-12 h-12 rounded-full border-2 border-white object-cover shadow-lg transform transition duration-300 hover:scale-105"
                />
                
                <!-- VOLUME/MUTE Button -->
                <div class="flex flex-col items-center cursor-pointer transition duration-200 action-icon" onclick="toggleMute()">
                    <!-- Speaker Icon (Inline SVG) - Toggled by JS -->
                    <svg id="volumeIcon" class="w-8 h-8 text-white transition-colors duration-200" fill="currentColor" viewBox="0 0 24 24">
                        <!-- Path for Volume ON (default state, hidden by JS) -->
                        <path id="volumeOnPath" d="M3 10v4c0 .55.45 1 1 1h3l5 5V5l-5 5H4c-.55 0-1 .45-1 1zM19 12c0-2.32-1.89-4.21-4-4.5v9c2.11-.29 4-2.18 4-4.5zm-2-.45v.9c.84-.28 1.5-.94 1.74-1.74H17z"/>
                        <!-- Path for Volume OFF (initial state) -->
                        <path id="volumeOffPath" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zM5 9v6h4l5 5V9.41l-1.81-1.81L5 9zM19.07 4.93l-1.66 1.66C20.03 7.84 21 9.7 21 12c0 3.87-2.73 7.08-6.5 7.82v-2.06c2.43-.72 4.25-2.9 4.5-5.59L17.5 14.5l-2.03-2.03L12 9.41l-6.84-6.84L3 4.5l1.41 1.41 2.07 2.07.01.01L10 12l2.45 2.45L12 16.59l4.03-4.03 2.21 2.21L19.07 19.07l1.41-1.41L4.93 3.52z"/>
                    </svg>
                    <span id="volumeStatus" class="text-xs font-semibold mt-0.5 drop-shadow-sm">Muted</span>
                </div>

                <!-- Like Button (Now displaying 4M as engagement count) -->
                <div class="flex flex-col items-center cursor-pointer transition duration-200 action-icon" onclick="toggleLike()">
                    <!-- Heart Icon (Inline SVG) -->
                    <svg id="heartIcon" class="w-8 h-8 text-white transition-colors duration-200" fill="currentColor" viewBox="0 0 24 24">
                        <path id="heartPath" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                    <span id="likeCount" class="text-xs font-semibold mt-0.5 drop-shadow-sm">420B</span>
                </div>

                <!-- Comment Button - NEW: Calls showComments() -->
                <div id="commentButton" class="flex flex-col items-center cursor-pointer transition duration-200 action-icon" onclick="showComments()">
                    <!-- Comment Icon (Inline SVG) -->
                    <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.888 9.888 0 01-3.621-.629M21 12c0-4.418-4.03-8-9-8s-9 3.582-9 8c0 1.09.28 2.123.834 3.031l-.226.753A1 1 0 003 16.5v1.25a.75.75 0 001.298.547l1.04-.849A10 10 0 0012 20c4.97 0 9-3.582 9-8z"/>
                    </svg>
                    <!-- Hardcoded count: 1M mock comments -->
                    <span class="text-xs font-semibold mt-0.5 drop-shadow-sm">1M</span>
                </div>

                <!-- Share Button -->
                <div class="flex flex-col items-center cursor-pointer transition duration-200 action-icon" onclick="showMessage('Share link copied to clipboard!')">
                    <!-- Share Icon (Inline SVG) -->
                    <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.592 9 11.832 9 11c0-2.343.878-4.48 2.308-6.064C13.563 3.486 15.568 2 17.5 2c3.597 0 6.5 3.003 6.5 6.706C24 10.983 22.844 13 20 13c-2.368 0-4.328-1.554-5.34-3.528A4.47 4.47 0 0012 14c-1.57 0-3.04.47-4.22 1.354l-1.95 2.138A10.87 10.87 0 0012 22c3.597 0 6.5-3.003 6.5-6.706C18.5 13.313 17.344 11 14.5 11c-2.368 0-4.328-1.554-5.34-3.528z"/>
                    </svg>
                    <span class="text-xs font-semibold mt-0.5 drop-shadow-sm">2M</span>
                </div>
            </div>
        </div>

        <!-- Message Box for Alerts (Bottom Center) -->
        <div id="messageBox" class="fixed bottom-10 left-1/2 -translate-x-1/2 p-3 bg-red-600 text-white rounded-lg shadow-xl z-50 transition-opacity duration-300 opacity-0 pointer-events-none">
            Notification!
        </div>

        <!-- NEW: Comments Panel -->
        <div id="commentsPanel" class="bg-gray-900 bg-opacity-95 z-50 p-4 flex flex-col rounded-t-xl">
            <!-- Header -->
            <div class="flex justify-between items-center pb-3 border-b border-gray-700">
                <div class="w-6"></div> <!-- Spacer for centering -->
                <div class="flex-1 text-center">
                    <!-- Updated header text for 1M comments -->
                    <span id="commentCountHeader" class="text-white font-semibold text-lg">1M comments</span>
                </div>
                <!-- Close Button -->
                <button onclick="hideComments()" class="p-1 rounded-full text-white hover:bg-gray-800 pointer-events-auto">
                    <!-- Close (X) Icon -->
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Comments List -->
            <div id="commentsList" class="flex-1 overflow-y-auto pt-3 space-y-4">
                <!-- Comments will be inserted here by JavaScript -->
            </div>

            <!-- Bottom Bar (No new comments allowed) -->
            <div class="pt-4 border-t border-gray-700 flex-shrink-0">
                <div class="bg-gray-700 p-3 rounded-xl text-gray-400 text-sm text-center">
                    Viewing mode only. Posting new comments is disabled.
                </div>
            </div>
        </div>
        
    </div>

    <script>
        const video = document.getElementById('partyVideo');
        const heartIcon = document.getElementById('heartIcon');
        const heartPath = document.getElementById('heartPath');
        const likeCountElement = document.getElementById('likeCount');
        const playPauseIndicator = document.getElementById('playPauseIndicator');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const messageBox = document.getElementById('messageBox');
        
        // NEW VOLUME ELEMENTS
        const volumeIcon = document.getElementById('volumeIcon');
        const volumeOnPath = document.getElementById('volumeOnPath');
        const volumeOffPath = document.getElementById('volumeOffPath');
        const volumeStatus = document.getElementById('volumeStatus');

        // NEW COMMENTS ELEMENTS
        const commentsPanel = document.getElementById('commentsPanel');
        const commentsList = document.getElementById('commentsList');
        const commentCountHeader = document.getElementById('commentCountHeader');


        let isLiked = false;
        // Initial like count set to 4,000,000 to reflect the '4M' starting display
        let likeCount = 4000000;
        let isVideoPaused = false; // Initial state: playing (autoplay)

        // Initial volume status: Muted is true because of the 'muted' attribute on the video tag.
        let isMuted = true;
        
        // Mock data for comments
        const MOCK_COMMENTS = [
            { user: "@CatLover99", text: "This is so true! Cats have personality.", likes: 1200 },
            { user: "@DogFanatic", text: "Big Buck Bunny is an actual dog though! 😂", likes: 50 },
            { user: "@SpoonzFan", text: "Love the take, @spoonser!", likes: 500 },
            { user: "@random_user", text: "What video is this? Looks cool.", likes: 10 },
            { user: "@animallover", text: "Both are great, but cats are definitely lower maintenance.", likes: 300 },
            { user: "@MemeLord", text: "The cat agenda is strong here.", likes: 220 },
            { user: "@realist", text: "4M likes but only 34 comments? 🤔", likes: 1 },
        ];


        /**
         * Helper function to format large numbers for display (e.g., 4000000 -> 4M)
         */
        function formatCount(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            }
            if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num;
        }


        document.addEventListener('DOMContentLoaded', () => {
            // Check if autoplay succeeded, otherwise show the play button
            video.addEventListener('playing', () => {
                isVideoPaused = false;
            });
            video.addEventListener('pause', () => {
                isVideoPaused = true;
            });

            // Initial attempt to play (to handle browser restrictions)
            video.play().catch(error => {
                console.log("Autoplay failed, user must click to start:", error);
                // If autoplay fails, show the play indicator
                showIndicator(playIcon);
                isVideoPaused = true;
            });

            // Set initial icon appearance based on the 'muted' attribute
            updateVolumeIcon();

            // Hide the default play indicator after 1 second if playing
            setTimeout(() => {
                if (!isVideoPaused) {
                    hideIndicator();
                }
            }, 1000);
            
            // Set the final comment count header to match the button text (1M)
            commentCountHeader.textContent = '1M comments';
        });

        function showIndicator(iconElement) {
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'none';
            iconElement.style.display = 'block';
            playPauseIndicator.classList.remove('opacity-0');
            playPauseIndicator.classList.add('opacity-100');
        }

        function hideIndicator() {
            playPauseIndicator.classList.remove('opacity-100');
            playPauseIndicator.classList.add('opacity-0');
        }

        /**
         * Handles playing and pausing the video, and toggles the icon indicator.
         */
        function togglePlayPause() {
            if (video.paused) {
                video.play();
                isVideoPaused = false;
                showIndicator(pauseIcon);
            } else {
                video.pause();
                isVideoPaused = true;
                showIndicator(playIcon);
            }

            // Hide the indicator after a short delay
            setTimeout(hideIndicator, 500);
        }

        /**
         * Toggles the like state and updates the count and icon style.
         */
        function toggleLike() {
            isLiked = !isLiked;

            if (isLiked) {
                // Liked state
                heartIcon.classList.remove('text-white');
                heartIcon.classList.add('text-red-500', 'drop-shadow-md');
                heartPath.setAttribute('fill', 'currentColor');
                likeCount += 1;
                // Add a small bounce animation
                heartIcon.classList.add('scale-125');
                setTimeout(() => heartIcon.classList.remove('scale-125'), 200);

            } else {
                // Unliked state
                heartIcon.classList.add('text-white');
                heartIcon.classList.remove('text-red-500', 'drop-shadow-md');
                heartPath.setAttribute('fill', 'none'); // Make it an outline when unliked
                likeCount -= 1;
            }

            // Update the display text using the new formatCount function
            likeCountElement.textContent = formatCount(likeCount);
        }

        /**
         * Toggles the video mute status.
         */
        function toggleMute() {
            isMuted = !isMuted;
            video.muted = isMuted;
            updateVolumeIcon();
        }

        /**
         * Updates the volume icon and status text.
         */
        function updateVolumeIcon() {
            if (isMuted) {
                volumeOnPath.style.display = 'none';
                volumeOffPath.style.display = 'block';
                volumeStatus.textContent = 'Muted';
            } else {
                volumeOnPath.style.display = 'block';
                volumeOffPath.style.display = 'none';
                volumeStatus.textContent = 'Volume';
            }
        }

        /**
         * Renders the mock comments into the list.
         */
        function renderComments() {
            // Only render once for performance, or if list is empty
            if (commentsList.children.length > 0) return; 

            MOCK_COMMENTS.forEach(comment => {
                // Use the first letter of the user handle as a simple avatar
                const initials = comment.user.charAt(1).toUpperCase(); 
                
                const commentHtml = `
                    <div class="flex space-x-3">
                        <!-- Mock Avatar -->
                        <div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center text-xs font-bold flex-shrink-0">
                            ${initials}
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-semibold text-gray-300">${comment.user}</p>
                            <p class="text-sm text-white mt-0.5 break-words">${comment.text}</p>
                            <div class="flex items-center space-x-2 mt-1 text-xs text-gray-400">
                                <span>${formatCount(comment.likes)} likes</span>
                                <span class="cursor-pointer hover:text-white transition duration-150">Reply</span>
                            </div>
                        </div>
                    </div>
                `;
                commentsList.insertAdjacentHTML('beforeend', commentHtml);
            });
        }

        /**
         * Shows the comments panel (slides up).
         */
        function showComments() {
            renderComments(); // Make sure comments are loaded
            commentsPanel.classList.remove('translate-y-full');
            commentsPanel.classList.add('is-visible');
            commentsPanel.style.pointerEvents = 'auto'; // Enable interactions
            document.body.style.overflow = 'hidden'; // Prevent scrolling of the background
        }

        /**
         * Hides the comments panel (slides down).
         */
        function hideComments() {
            commentsPanel.classList.add('translate-y-full');
            commentsPanel.classList.remove('is-visible');
            // Timeout to allow transition to finish before disabling pointer events
            setTimeout(() => { commentsPanel.style.pointerEvents = 'none'; }, 300);
            document.body.style.overflow = ''; // Restore scrolling
        }


        /**
         * Displays a temporary notification message at the bottom.
         */
        function showMessage(text) {
            messageBox.textContent = text;
            messageBox.classList.remove('opacity-0', 'pointer-events-none');
            messageBox.classList.add('opacity-100', 'pointer-events-auto');

            setTimeout(() => {
                messageBox.classList.remove('opacity-100', 'pointer-events-auto');
                messageBox.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);

            // For the share button, copy to clipboard
            if (text.includes('copied')) {
                const dummy = document.createElement('textarea');
                // Use a generic placeholder link for the party
                dummy.value = window.location.href; 
                document.body.appendChild(dummy);
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
            }
        }
    </script>
</body>
</html>
